name: Build and Push EventHub BE

on:
  push:
    branches:
      - development
    paths:
      - "EventHub-BE/**"
      - ".github/workflows/be-image.yml"
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Build and push BE image
        uses: docker/build-push-action@v6
        with:
          context: ./EventHub-BE
          file: ./EventHub-BE/BE.Dockerfile
          push: true
          tags: ghcr.io/${{github.repository_owner}}/eventhub-be:latest
